<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a30">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📗</text></svg>">
  <script>try{if(localStorage.getItem("pr-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <title>Home — Proctor Register</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="home-hero">
    <div class="home-hero-inner">
      <p class="hh-date" id="hero-date"></p>
      <h1 id="greeting">Welcome</h1>
      <p class="hh-sub" id="hero-sub">Here's how your register is doing today.</p>
    </div>
  </header>

  <main class="page home-page">
    <section id="stats-zone" hidden>
      <div id="stats-grid" class="stat-cards"></div>
      <div id="status-chips" class="status-chips" hidden></div>
    </section>

    <h2 class="section-heading">Quick start</h2>
    <div class="big-actions home-actions">
      <a class="big-action" href="add-student.html">
        <span class="icon" data-icon="userplus"></span>
        <span>
          <span class="ba-title">Add a Student</span><br>
          <span class="ba-sub">Add one student by hand</span>
        </span>
      </a>
      <a class="big-action" href="upload.html">
        <span class="icon" data-icon="upload"></span>
        <span>
          <span class="ba-title">Add from Excel</span><br>
          <span class="ba-sub">Add a whole class at once</span>
        </span>
      </a>
      <a class="big-action" href="students.html">
        <span class="icon" data-icon="users"></span>
        <span>
          <span class="ba-title">Find a Student</span><br>
          <span class="ba-sub">Search, check history, record incidents</span>
        </span>
      </a>
    </div>

    <section id="activity-zone" hidden>
      <h2 class="section-heading">Recent activity</h2>
      <div class="card activity-card">
        <ul class="activity-list" id="activity-list"></ul>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/page-home.js"></script>
</body>
</html>
