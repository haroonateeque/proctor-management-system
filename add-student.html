<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a30">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📗</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <script>try{if(localStorage.getItem("pr-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <title>Add Student — Proctor Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="topbar"><div class="topbar-inner">
      <button class="back-btn" onclick="history.back()" aria-label="Go back">‹</button>
      <span class="page-title" id="page-title">Add a Student</span>
    </div></div>

    <form id="add-form" class="card" style="margin-top:16px" novalidate>
      <div class="form-error" id="form-error"></div>

      <div class="form-section">
        <h3>Who is the student?</h3>
        <div class="form-grid">
          <div class="field">
            <label for="name">Full Name <span class="hint">(required)</span></label>
            <input type="text" id="name" placeholder="e.g. Ali Raza" autocomplete="off">
          </div>
          <div class="field">
            <label for="student_id">Student ID <span class="hint">(required)</span></label>
            <input type="text" id="student_id" placeholder="e.g. FA21-BCS-001" autocomplete="off">
            <span class="hint" id="dupe-warning" style="display:none;color:var(--danger);font-weight:600"></span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Class information <span class="hint">(all optional)</span></h3>
        <div class="form-grid">
          <div class="field">
            <label for="class_name">Class / Program</label>
            <input type="text" id="class_name" placeholder="e.g. BSCS">
          </div>
          <div class="field">
            <label for="section">Section</label>
            <input type="text" id="section" placeholder="e.g. A">
          </div>
          <div class="field">
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="e.g. Computer Science">
          </div>
          <div class="field">
            <label for="semester">Semester</label>
            <input type="text" id="semester" placeholder="e.g. 5th">
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Contact <span class="hint">(all optional)</span></h3>
        <div class="form-grid">
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="e.g. 0300 1234567">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="e.g. student@university.edu">
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Guardian &amp; personal details <span class="hint">(all optional)</span></h3>
        <div class="form-grid">
          <div class="field">
            <label for="father_name">Father / Guardian Name</label>
            <input type="text" id="father_name" placeholder="e.g. Muhammad Raza">
          </div>
          <div class="field">
            <label for="guardian_phone">Guardian Phone</label>
            <input type="tel" id="guardian_phone" placeholder="e.g. 0301 7654321">
          </div>
          <div class="field">
            <label for="blood_group">Blood Group</label>
            <input type="text" id="blood_group" placeholder="e.g. B+" maxlength="4">
          </div>
          <div class="field">
            <label for="hostel">Hostel Status</label>
            <select id="hostel">
              <option value="">—</option>
              <option value="Day Scholar">Day Scholar</option>
              <option value="Hosteller">Hosteller</option>
            </select>
          </div>
          <div class="field">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob">
          </div>
          <div class="field">
            <label for="cnic">CNIC / B-Form</label>
            <input type="text" id="cnic" placeholder="e.g. 35202-1234567-1">
          </div>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="House, street, city">
        </div>
      </div>

      <div class="form-section">
        <h3>Notes <span class="hint">(optional)</span></h3>
        <div class="field">
          <textarea id="notes" placeholder="Anything worth remembering about this student"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="save-btn">Save Student</button>
        <a class="btn btn-secondary" id="cancel-link" href="students.html">Cancel</a>
      </div>
    </form>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/page-add-student.js"></script>
</body>
</html>
